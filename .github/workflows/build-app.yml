name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            reqs: requirements-windows.txt
            artifact: NERVE-windows
          - os: ubuntu-latest
            reqs: requirements.txt
            artifact: NERVE-linux
          - os: macos-latest
            reqs: requirements-macos.txt
            artifact: NERVE-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.reqs }} pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name NERVE
          --collect-all gradio --collect-all gradio_client
          --collect-all safehttpx --collect-all groovy
          app.py
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../NERVE-${{ runner.os }}.zip NERVE
          else
            zip -r ../NERVE-${{ runner.os }}.zip NERVE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: NERVE-*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NERVE-*.zip
